{% with url_name=request.resolver_match.url_name %}
<nav class="flex flex-wrap gap-1 mb-2 text-sm">
  <a href="{% url 'expense_list' %}" class="px-3 py-1.5 rounded-lg {% if url_name == 'expense_list' or url_name == 'expense_create' or url_name == 'expense_edit' %}bg-slate-900 text-white{% else %}bg-white border border-slate-200 text-slate-700 hover:bg-slate-50{% endif %}">Register</a>
  <a href="{% url 'expense_quick' %}" class="px-3 py-1.5 rounded-lg {% if url_name == 'expense_quick' %}bg-slate-900 text-white{% else %}bg-white border border-slate-200 text-slate-700 hover:bg-slate-50{% endif %}">📷 Quick add</a>
  <a href="{% url 'expense_vendors' %}" class="px-3 py-1.5 rounded-lg {% if 'expense_vendor' in url_name %}bg-slate-900 text-white{% else %}bg-white border border-slate-200 text-slate-700 hover:bg-slate-50{% endif %}">Vendors</a>
  <a href="{% url 'expense_categories' %}" class="px-3 py-1.5 rounded-lg {% if url_name == 'expense_categories' %}bg-slate-900 text-white{% else %}bg-white border border-slate-200 text-slate-700 hover:bg-slate-50{% endif %}">Categories</a>
  <a href="{% url 'expense_recurring' %}" class="px-3 py-1.5 rounded-lg {% if 'expense_recurring' in url_name %}bg-slate-900 text-white{% else %}bg-white border border-slate-200 text-slate-700 hover:bg-slate-50{% endif %}">Recurring</a>
  <a href="{% url 'expense_budgets' %}" class="px-3 py-1.5 rounded-lg {% if url_name == 'expense_budgets' %}bg-slate-900 text-white{% else %}bg-white border border-slate-200 text-slate-700 hover:bg-slate-50{% endif %}">Budgets</a>
  <a href="{% url 'expense_mileage' %}" class="px-3 py-1.5 rounded-lg {% if url_name == 'expense_mileage' %}bg-slate-900 text-white{% else %}bg-white border border-slate-200 text-slate-700 hover:bg-slate-50{% endif %}">Mileage</a>
</nav>
<nav class="flex flex-wrap items-center gap-1 mb-4 text-xs">
  <span class="px-2 py-1 uppercase tracking-widest text-[10px] text-slate-500">Reports</span>
  <a href="{% url 'expense_report_by_month' %}" class="px-2.5 py-1 rounded-md {% if url_name == 'expense_report_by_month' %}bg-indigo-600 text-white{% else %}bg-white border border-slate-200 text-slate-600 hover:bg-slate-50{% endif %}">By month</a>
  <a href="{% url 'expense_report_missing_receipts' %}" class="px-2.5 py-1 rounded-md {% if url_name == 'expense_report_missing_receipts' %}bg-indigo-600 text-white{% else %}bg-white border border-slate-200 text-slate-600 hover:bg-slate-50{% endif %}">Missing receipts</a>
  <a href="{% url 'expense_report_unpaid_bills' %}" class="px-2.5 py-1 rounded-md {% if url_name == 'expense_report_unpaid_bills' %}bg-indigo-600 text-white{% else %}bg-white border border-slate-200 text-slate-600 hover:bg-slate-50{% endif %}">Unpaid bills (AP aging)</a>
  <a href="{% url 'expense_report_1099' %}" class="px-2.5 py-1 rounded-md {% if url_name == 'expense_report_1099' %}bg-indigo-600 text-white{% else %}bg-white border border-slate-200 text-slate-600 hover:bg-slate-50{% endif %}">1099 vendors</a>
  <a href="{% url 'expense_year_end' %}" class="px-2.5 py-1 rounded-md {% if url_name == 'expense_year_end' %}bg-indigo-600 text-white{% else %}bg-white border border-slate-200 text-slate-600 hover:bg-slate-50{% endif %}">Year-end package</a>
</nav>
{% endwith %}
