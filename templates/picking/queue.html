{% load static %}<!DOCTYPE html>
<html lang="en" class="bg-slate-100">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>Pick queue</title>
  <link rel="stylesheet" href="{% static 'css/app.css' %}">
</head>
<body class="min-h-screen">
<header class="bg-slate-900 text-white px-4 py-4 flex items-center justify-between sticky top-0 z-10">
  <div class="flex items-center gap-2">
    <button onclick="goBack()" class="w-10 h-10 rounded-lg bg-slate-700 text-xl font-bold">←</button>
    <a href="{% url u_home_url %}" class="w-10 h-10 rounded-lg bg-slate-700 text-xl flex items-center justify-center">🏠</a>
    <h1 class="text-xl font-bold ml-1">🛒 Pick queue</h1>
  </div>
  <div class="flex items-center gap-3 text-sm">
    <span class="text-slate-300">{{ request.user.username }}</span>
    <form method="post" action="{% url 'logout' %}">{% csrf_token %}
      <button class="rounded-lg bg-slate-700 px-3 py-1.5">Sign out</button></form>
  </div>
</header>

<main class="p-4 max-w-2xl mx-auto" id="queue">
  <p class="text-center text-slate-400 py-10 text-lg" id="loading">Loading…</p>
</main>

<script>
const HOME_URL = "{% url u_home_url %}";
function goBack() {
  // In a home-screen web app there may be no browser history — fall back
  // to the user's home page instead of doing nothing.
  if (window.history.length > 1 && document.referrer &&
      document.referrer.indexOf(location.host) !== -1 &&
      !document.referrer.endsWith(location.pathname)) {
    history.back();
  } else {
    location.href = HOME_URL;
  }
}
async function load() {
  const r = await fetch('/api/pick/queue/', {headers: {'Accept': 'application/json'}});
  const data = await r.json();
  const el = document.getElementById('queue');
  if (!data.orders.length) {
    el.innerHTML = '<div class="text-center py-16"><p class="text-5xl mb-4">✅</p><p class="text-xl text-slate-500 font-medium">Queue is empty — nothing to pick.</p></div>';
    return;
  }
  el.innerHTML = data.orders.map(o => `
    <a href="/pick/${o.id}/" class="block bg-white rounded-2xl shadow-sm border border-slate-200 p-5 mb-4 active:bg-indigo-50">
      <div class="flex justify-between items-start">
        <div>
          <p class="text-2xl font-extrabold text-slate-900">${o.number}</p>
          <p class="text-lg text-slate-600">${o.customer}</p>
          <p class="text-sm text-slate-400 mt-1">${o.line_count} lines · ${o.total_units} units · ${o.created}</p>
        </div>
        <div class="text-right">
          ${o.priority === 1 ? '<span class="inline-block rounded-full bg-red-100 text-red-700 px-3 py-1 text-sm font-bold">RUSH</span>' :
            o.priority === 2 ? '<span class="inline-block rounded-full bg-amber-100 text-amber-700 px-3 py-1 text-sm font-bold">HIGH</span>' : ''}
          ${o.status === 'picking' ? `<p class="mt-2 text-amber-600 font-bold text-lg">${o.progress}%</p>` :
            '<p class="mt-2 text-sky-600 font-semibold">ready</p>'}
        </div>
      </div>
      ${o.status === 'picking' ? `<div class="mt-3 bg-slate-200 rounded-full h-3"><div class="bg-amber-500 h-3 rounded-full" style="width:${o.progress}%"></div></div>` : ''}
    </a>`).join('');
}
load();
setInterval(load, 10000);
</script>
</body>
</html>
