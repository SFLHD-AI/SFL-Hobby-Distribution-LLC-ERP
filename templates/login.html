{% load static %}<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-900">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · {{ company.company_name }}</title>
  <link rel="stylesheet" href="{% static 'css/app.css' %}">
</head>
<body class="h-full flex items-center justify-center p-4">
  <div class="w-full max-w-sm">
    <div class="text-center mb-6">
      {% if company.logo %}<img src="{{ company.logo.url }}" class="h-14 mx-auto bg-white rounded-lg p-1.5">{% endif %}
      <h1 class="mt-3 text-2xl font-bold text-white">{{ company.company_name }}</h1>
      <p class="text-slate-400 text-sm mt-1">Sign in to SFL ERP System</p>
    </div>
    <form method="post" class="card-pad space-y-4">
      {% csrf_token %}
      {% if form.errors %}<div class="rounded-lg bg-red-50 border border-red-200 text-red-700 text-sm px-3 py-2">
        Wrong username or password.</div>{% endif %}
      <div class="field"><label>Username</label>
        <input type="text" name="username" autofocus autocapitalize="none" required></div>
      <div class="field"><label>Password</label>
        <input type="password" name="password" required></div>
      <button class="btn-primary w-full justify-center py-2.5">Sign in</button>
      <input type="hidden" name="next" value="{{ next }}">
    </form>
    <p class="text-center text-slate-500 text-xs mt-4">SFL ERP System v{{ app_version }}</p>
  </div>
</body>
</html>
